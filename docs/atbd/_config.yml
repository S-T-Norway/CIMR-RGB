# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: CIMR RGB ATBD
author: Joseph Heywood, Maksym Brilenkov and Davide Decataldo
logo: logo.jpg

# Force re-execution of notebooks on each build.
# See https://jupyterbook.org/content/execute.html
execute:
  execute_notebooks: force

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: atbd.tex

# Add a bibtex file so that we can create citations
bibtex_bibfiles:
  - biblio.bib

# Format the citation style
sphinx:
  config:
    bibtex_reference_style: author_year
    html_show_copyright: false
    numfig: true
    intersphinx_mapping:
      l1c:
        - https://html.wps.met.no/jupyterbook/ATBD-HTML-Collection/L1C_ATBD/
        - l1c_objects.inv

  extra_extensions:
    - sphinxcontrib.mermaid
    - sphinx.ext.intersphinx

# Information about where the book exists on the web
repository:
  url: https://github.com/S-T-Norway/CIMR-RGB  # Online location of your book
  path_to_book: docs/atbd  # Optional path to your book, relative to the repository root
  branch: main  # Which branch of the repository should be used when creating links (optional)

# Add GitHub buttons to your book
# See https://jupyterbook.org/customize/config.html#add-a-link-to-your-repository
html:
  use_issues_button: false
  use_repository_button: true
  extra_footer: |
    <p>
      This ATBD was developed in the context of the ESA-funded CIMR RGB Re-Gridding Tool Box EXPRO project (4000141564/23/I-AG).
    </p>
    <p>
      Document ID: CIMR-ATBD-ST-RGB-005 v2.0
    </p>
  announcement: This is V2 of the ATBD, converted to Jupyter book from CIMR L1C PR2
